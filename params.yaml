# application parameters
rag_app:
  prompt_label: "baseline"
  llm: "gpt-5-mini"
  embedder_model: "text-embedding-3-small"
  embedder_dimensions: 1024
  chunk_size: 220
  chunk_overlap: 10
  tokenizer_encoding: "o200k_base"
  collection_name: "rag_demo"
  search_type: "similarity"
  k: 3

# golden dataset
golden_dataset:
  dataset_model: "gpt-5.4-mini"
  max_goldens_per_context: 1
  golden_dataset_file_name: "golden_dataset_final"

  filtration_config:
    filtration_threshold: 0.6
    filtration_max_retries: 2
    filtration_critic_model: "gpt-5-mini"
  
  context_construction_config:
    construction_critic_model: "gpt-5.4-mini"
    max_context_length: 3
    min_context_length: 1
    max_contexts_per_document: 1
    context_quality_threshold: 0.7
    context_max_retries: 2
    context_chunk_size: 300
    context_chunk_overlap: 30

  evolution_config:
    num_evolution: 2
    evolutions:
      multicontext: 0.1
      concretizing: 0.3
      constrained: 0.4
      comparative: 0.2

evaluation_dataset:
  evaluation_dataset_file_name: "evaluation_dataset_final"

# evaluate rag app
evaluation:
  judge_llm: "gpt-5.4-mini"
  async_config:
    throttle_value: 3
    max_concurrent: 5
  display_config:
      result_dir: evaluation_results
      report_dir: evaluation_report